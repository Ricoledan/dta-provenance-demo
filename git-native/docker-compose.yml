version: '3.8'

services:
  # API Service
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: dta-provenance-api
    ports:
      - "8000:8000"
    environment:
      - REPO_PATH=/repo
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/repo
    command: >
      sh -c "cd /repo && (test -d .git || git init) && python -m src.cli serve --host 0.0.0.0 --port 8000 --repo /repo"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dta-network

  # Dashboard Service
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dta-provenance-dashboard
    ports:
      - "3001:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - dta-network

networks:
  dta-network:
    driver: bridge

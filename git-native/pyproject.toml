[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dta-provenance"
version = "1.0.0"
description = "DTA-compliant data provenance tracking using Git"
readme = "README.md"
authors = [
    {name = "Ricardo Ledan", email = "ricardo@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["provenance", "data", "git", "dta", "ai", "ml", "audit", "compliance"]
requires-python = ">=3.9"

dependencies = [
    "GitPython>=3.1.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "jsonschema>=4.0.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
viz = [
    "pygraphviz>=1.11",
    "matplotlib>=3.7.0",
]
dvc = [
    "dvc>=3.0",
]
mlflow = [
    "mlflow>=2.0",
]
sbom = [
    "cyclonedx-bom>=4.0",
]
api = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "httpx>=0.24",
]
all = [
    "dta-provenance[mlflow,dvc,sbom,api]",
]

[project.urls]
Homepage = "https://github.com/Ricoledan/dta-provenance-demo"
Documentation = "https://ricoledan.github.io/dta-provenance-demo"
Repository = "https://github.com/Ricoledan/dta-provenance-demo"
Issues = "https://github.com/Ricoledan/dta-provenance-demo/issues"

[project.scripts]
dta-provenance = "src.cli:cli"
dta-provenance-validate-metadata = "src.hooks:validate_metadata_hook"
dta-provenance-check-trailers = "src.hooks:check_trailers_hook"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=src",
    "--cov-report=html",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "I", "N", "W"]
ignore = []

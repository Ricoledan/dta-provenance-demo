name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  git-native-tests:
    name: Git-Native Python Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('git-native/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        cd git-native
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
        pip install -e .

    - name: Run tests with coverage
      run: |
        cd git-native
        pytest --cov=src --cov-report=xml --cov-report=term -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./git-native/coverage.xml
        flags: git-native
        name: git-native-${{ matrix.python-version }}
      if: matrix.python-version == '3.11'

  blockchain-tests:
    name: Blockchain Smart Contract Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['18.x', '20.x', '22.x']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Cache npm packages
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('blockchain/package.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: |
        cd blockchain
        npm ci

    - name: Run Hardhat tests
      run: |
        cd blockchain
        npx hardhat test

    - name: Run gas report
      run: |
        cd blockchain
        npx hardhat test --gas-report
      continue-on-error: true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [git-native-tests, blockchain-tests]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install Git-native dependencies
      run: |
        cd git-native
        pip install -r requirements.txt
        pip install -e .

    - name: Install Blockchain dependencies
      run: |
        cd blockchain
        npm ci

    - name: Validate DTA standards examples
      run: |
        cd git-native
        for file in ../standards/examples/*.json; do
          echo "Validating $file..."
          dta-provenance validate "$file" || exit 1
        done

    - name: Test CLI installation
      run: |
        dta-provenance --version
        dta-provenance --help

  lint-and-format:
    name: Linting and Formatting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python linting tools
      run: |
        pip install black flake8 isort

    - name: Check Python formatting with black
      run: |
        cd git-native
        black --check src/ tests/
      continue-on-error: true

    - name: Run flake8
      run: |
        cd git-native
        flake8 src/ tests/ --max-line-length=100 --extend-ignore=E203,W503
      continue-on-error: true

    - name: Check import sorting
      run: |
        cd git-native
        isort --check-only src/ tests/
      continue-on-error: true

    - name: Set up Node.js for Solidity linting
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install Solidity linting tools
      run: |
        cd blockchain
        npm ci

    - name: Lint Solidity contracts
      run: |
        cd blockchain
        npx hardhat check
      continue-on-error: true
